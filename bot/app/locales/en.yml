menu:
  open_requests: "🩸 Open requests"
  my_account: "👤 My account"
  help: "❓ Help"
  help_text: |
    This bot sends you blood requests from the blood bank that match your blood
    group, your district, and how recently you last donated.

    You will never be asked about a patient, and your number is never shared
    with anyone outside the blood bank.

    {support}

fallback:
  unregistered: |
    I did not understand that. To register as a donor, send /start.

    {support}
  registered: |
    I did not understand that. You are registered, so there is nothing you need to
    do -- we will message you when someone nearby needs your blood group.

    {support}
  not_text: "I can only read text and the buttons I send. Send /start if you are stuck."
  stale_button: "That button is from an old message. Send /start to continue."

admin:
  card: |
    {card}

    📊 <b>Live</b> · {accepted} accepted · {confirmed}/{units} confirmed · {completed} donated
    👤 {notified} donors notified
    {status}
  status_open: "🟢 Open -- keep sharing the link below."
  status_filled: "✅ Filled -- enough donors confirmed. You can stop sharing."
  status_completed: "🎉 Completed -- every unit collected. Thank you."
  status_cancelled: "⛔ Withdrawn by the blood bank. Please stop sharing."
  status_expired: "⌛ Expired unfilled. Please stop sharing."
  refresh: "🔄 Refresh"
  refreshed: "Updated"
  share: |
    🩸 URGENT: {blood_group} blood needed

    Units: {units}
    Needed by: {needed_by}
    Where: {hospital}, {address}, {city}

    If you are {blood_group}-compatible, in {district}, and can donate, tap this link. It takes a minute to register and you will be told exactly where to go:
    {link}

    Please forward to anyone who might help. No patient details are shared.
  not_admin: "This button is for volunteer admins."
