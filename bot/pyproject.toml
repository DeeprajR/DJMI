[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-donor-bot"
version = "0.1.0"
description = "Telegram bot that distributes blood-bank demand to eligible donors"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    # Windows ships no IANA tz database; donors are shown local time.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.bot",
    "app.bot.handlers",
    "app.core",
    "app.integration",
]

[tool.setuptools.package-data]
"app" = ["locales/*.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
