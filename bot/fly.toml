# Module 3 — the Telegram donor bot, deployed from bot/.
#
# Deliberately has no [http_service] and no [[services]] block. The bot has no
# public surface: the blood bank hands it work by writing rows to Neon and
# Telegram is reached by long polling. That absence also means Fly never
# auto-stops the machine — an idle-stopped machine would stop polling, and
# donors would go unnotified until the next request woke it.
#
# Run exactly one machine. Telegram rejects a second poller on the same token,
# so `fly scale count 1` is a correctness constraint, not a cost decision.

app = "blood-donor-bot"
primary_region = "ord"          # nearest Fly region to Neon's us-east-2 (Ohio)

[build]
  dockerfile = "Dockerfile"

[env]
  DB_SCHEMA = "donor_bot"
  BANK_SYNC_ENABLED = "true"
  BANK_ID = "hospital_bank"

# BOT_TOKEN, BOT_USERNAME and DATABASE_URL are set with `fly secrets set`,
# never here — this file is committed to a public repository.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"              # aiogram + SQLAlchemy idle around 150 MB
  cpus = 1
