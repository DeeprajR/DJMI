services:
  postgres:
    image: postgres:16-alpine
    container_name: blood-request-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blood_request
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - blood_request_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blood_request"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blood_request_pgdata:
